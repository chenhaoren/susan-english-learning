<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Susan英语学习平台</title>
    <style>
        /* 基础样式 */
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 导航栏样式 */
        .nav {
            background: #4CAF50;
            padding: 15px;
            color: white;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        /* 主要内容区域 */
        .main-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .learning-module {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            background: #f9f9f9;
        }

        /* 互动元素样式 */
        .interactive-element {
            background: #fff;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="container">
            <a href="#home">首页</a>
            <a href="#daily-conversation">每日对话</a>
            <a href="#situational-learning">情境学习</a>
            <a href="#vocabulary">词汇积累</a>
            <a href="#grammar">语法练习</a>
            <a href="#progress">学习进度</a>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>欢迎来到Susan英语学习平台</h1>
            <p>通过自然习得法，让英语学习变得简单有趣</p>
        </header>

        <div class="main-content">
            <!-- 每日对话模块 -->
            <section class="learning-module" id="daily-conversation">
                <h2>每日对话</h2>
                <div class="interactive-element">
                    <h3>今日主题：日常问候</h3>
                    <div id="conversation-player">
                        <!-- 对话播放器将在这里 -->
                    </div>
                    <button onclick="playConversation()">播放对话</button>
                    <button onclick="practiceConversation()">练习对话</button>
                </div>
            </section>

            <!-- 情境学习模块 -->
            <section class="learning-module" id="situational-learning">
                <h2>情境学习</h2>
                <div class="interactive-element">
                    <h3>选择场景：</h3>
                    <select id="scenario-select">
                        <option value="restaurant">餐厅点餐</option>
                        <option value="shopping">购物对话</option>
                        <option value="travel">旅行交流</option>
                    </select>
                    <div id="scenario-content">
                        <!-- 情境内容将在这里动态加载 -->
                    </div>
                </div>
            </section>

            <!-- 词汇积累模块 -->
            <section class="learning-module" id="vocabulary">
                <h2>词汇积累</h2>
                <div class="interactive-element">
                    <h3>今日词汇</h3>
                    <div id="vocabulary-list">
                        <!-- 词汇列表将在这里 -->
                    </div>
                    <div class="vocabulary-game">
                        <button onclick="startVocabularyGame()">开始词汇游戏</button>
                    </div>
                </div>
            </section>

            <!-- 语法练习模块 -->
            <section class="learning-module" id="grammar">
                <h2>语法练习</h2>
                <div class="interactive-element">
                    <h3>今日语法点</h3>
                    <div id="grammar-exercise">
                        <!-- 语法练习将在这里 -->
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        // 基础功能实现
        function playConversation() {
            // 实现对话播放功能
            console.log('播放对话');
        }

        function practiceConversation() {
            // 实现对话练习功能
            console.log('开始练习');
        }

        function startVocabularyGame() {
            // 实现词汇游戏功能
            console.log('开始词汇游戏');
        }

        // 场景选择功能
        document.getElementById('scenario-select').addEventListener('change', function(e) {
            // 根据选择的场景加载相应内容
            console.log('选择的场景：', e.target.value);
        });
    </script>
</body>
</html>
