<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机组词小程序(横向版)</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', 'Arial', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 12px 32px 12px;
            background: #f8fafc;
            min-height: 100vh;
        }
        h1 {
            font-size: 2.2rem;
            color: #35495e;
            margin-bottom: 8px;
            letter-spacing: 2px;
            font-weight: 700;
        }
        p {
            color: #5c7080;
            font-size: 1.1rem;
            margin-bottom: 24px;
        }
        .sentence-container {
            display: flex;
            justify-content: center;
            align-items: stretch;
            margin: 40px 0 32px 0;
            gap: 18px;
        }
        .word-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px 18px 18px 18px;
            background: #fff;
            border-radius: 16px;
            min-width: 140px;
            box-shadow: 0 2px 8px 0 rgba(60,60,120,0.08);
            border: 1.5px solid #e5e9f2;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .word-box:hover {
            box-shadow: 0 8px 32px 0 rgba(66,185,131,0.13);
            transform: translateY(-4px) scale(1.03);
        }
        .word {
            font-size: 2.3rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #42b983;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px #e5f7ef;
            transition: color 0.2s;
            position: relative;
            display: inline-flex;
            align-items: flex-start;
        }
        .word-type {
            color: #5c7080;
            font-size: 1rem;
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .connector {
            font-size: 2.2rem;
            color: #42b983;
            margin: 0 2px;
            align-self: center;
        }
        .vue-btn {
            background: #42b983;
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            margin: 10px 8px 10px 0;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 2px 8px 0 rgba(66,185,131,0.08);
            transition: background 0.2s, transform 0.2s;
            font-weight: 500;
        }
        .vue-btn:hover {
            background: #36976b;
            transform: translateY(-2px) scale(1.04);
        }
        /* 上传右上角按钮 */
        .upload-fab {
            position: fixed;
            top: 28px;
            right: 32px;
            z-index: 100;
            width: 48px;
            height: 48px;
            background: #42b983;
            border-radius: 50%;
            box-shadow: 0 2px 8px 0 rgba(66,185,131,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .upload-fab:hover {
            background: #36976b;
            box-shadow: 0 4px 16px 0 rgba(66,185,131,0.28);
        }
        .upload-fab-icon {
            font-size: 2rem;
            color: #fff;
            user-select: none;
        }
        /* 上传弹窗 */
        .upload-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(60,60,120,0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.25s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .upload-panel {
            background: #fff;
            border-radius: 14px;
            padding: 32px 32px 24px 32px;
            min-width: 320px;
            box-shadow: 0 8px 32px 0 rgba(66,185,131,0.13);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: panelPop 0.25s;
            position: relative;
        }
        @keyframes panelPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .upload-panel input[type="file"] {
            padding: 10px 0;
            font-size: 1rem;
            border-radius: 6px;
            border: 1.5px solid #42b983;
            background: #f8fafc;
            margin-bottom: 10px;
            color: #35495e;
            width: 220px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 4px 0 rgba(66,185,131,0.08);
        }
        .upload-panel input[type="file"]:focus {
            border: 1.5px solid #36976b;
            box-shadow: 0 2px 8px 0 rgba(66,185,131,0.13);
        }
        .upload-tips {
            color: #5c7080;
            font-size: 0.98rem;
            background: #eafaf5;
            border-radius: 6px;
            padding: 7px 12px;
            margin-bottom: 14px;
            border-left: 3px solid #42b983;
            box-shadow: 0 1px 4px 0 rgba(66,185,131,0.04);
        }
        .upload-panel .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #42b983;
            cursor: pointer;
        }
        #uploadStatus {
            color: #36976b;
            margin-top: 10px;
            font-size: 1.08rem;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .divider {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #42b983 0%, #f8fafc 100%);
            border: none;
            margin: 36px 0 24px 0;
            border-radius: 2px;
        }
        #deepseek-sentence {
            margin-top: 28px;
            color: #35495e;
            font-size: 1.18rem;
            background: #f8fafc;
            border-radius: 10px;
            padding: 18px 16px;
            box-shadow: 0 2px 8px 0 rgba(66,185,131,0.06);
            min-height: 40px;
            text-align: left;
            word-break: break-all;
        }
        /* 造句输出美化 */
        .sentence-output-card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 24px 0 rgba(66,185,131,0.10);
            padding: 28px 22px 18px 22px;
            margin: 32px auto 0 auto;
            max-width: 600px;
            min-height: 120px;
            text-align: left;
            position: relative;
            animation: fadeIn 0.5s;
        }
        .output-title {
            font-size: 1.18rem;
            color: #42b983;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .output-title .icon {
            font-size: 1.3rem;
        }
        .output-words {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }
        .output-word-tag {
            background: #e8f8f2;
            color: #42b983;
            border-radius: 8px;
            padding: 6px 16px;
            font-size: 1.08rem;
            font-weight: 600;
            box-shadow: 0 1px 4px 0 rgba(66,185,131,0.08);
            border: 1.5px solid #b7eedc;
            letter-spacing: 1px;
        }
        .output-word-tag.verb { background: #e0f7ef; }
        .output-word-tag.adj { background: #e6f9f2; }
        .output-word-tag.noun { background: #eafaf5; }
        .output-section {
            margin-bottom: 12px;
        }
        .output-label {
            color: #5c7080;
            font-size: 1.01rem;
            font-weight: 500;
            margin-bottom: 2px;
        }
        .output-sentence-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .speak-btn {
            background: #eafaf5;
            border: none;
            color: #42b983;
            font-size: 1.25rem;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            outline: none;
        }
        .speak-btn:hover, .speak-btn:active {
            background: #42b983;
            color: #fff;
        }
        .output-sentence {
            font-size: 1.18rem;
            color: #222;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.7;
        }
        .output-translation {
            font-size: 1.08rem;
            color: #36976b;
            margin-bottom: 4px;
        }
        .output-analysis {
            font-size: 1.01rem;
            color: #35495e;
            background: #f8fafc;
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 6px;
            line-height: 1.7;
        }
        /* 随机词高亮 */
        .highlight-word {
            color: #fff;
            background: #42b983;
            border-radius: 6px;
            padding: 2px 7px;
            font-weight: 700;
            box-shadow: 0 1px 4px 0 rgba(66,185,131,0.10);
            margin: 0 2px;
            display: inline-block;
            transition: background 0.2s;
        }
        .word-badge {
            position: absolute;
            top: -30px;
            right: -50px;
            background: linear-gradient(135deg, #ff7b7b 60%, #ffb3b3 100%);
            color: #fff;
            font-size: 1.02rem;
            font-weight: 700;
            border-radius: 999px;
            padding: 1.5px 9px 1.5px 9px;
            min-width: 22px;
            min-height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px 0 rgba(66,185,131,0.13);
            border: 2px solid #fff;
            z-index: 2;
            font-family: inherit;
            line-height: 1.1;
            display: none;
        }
        /* 单词库展示样式 */
        .word-bank-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(60,60,120,0.10);
            display: none;
            align-items: flex-start;
            justify-content: center;
            z-index: 200;
            padding: 40px 20px;
            overflow-y: auto;
            animation: fadeIn 0.25s;
        }
        .word-bank-panel {
            background: #fff;
            border-radius: 14px;
            padding: 32px;
            width: 90%;
            max-width: 1000px;
            box-shadow: 0 8px 32px 0 rgba(66,185,131,0.13);
            animation: panelPop 0.25s;
            position: relative;
        }
        .word-bank-title {
            font-size: 1.5rem;
            color: #35495e;
            margin-bottom: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .word-bank-section {
            margin-bottom: 32px;
        }
        .word-bank-section-title {
            font-size: 1.2rem;
            color: #42b983;
            margin-bottom: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .word-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .word-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
            cursor: default;
        }
        .word-item:hover {
            transform: translateY(-2px);
        }
        .word-item-count {
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }
        .word-bank-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: #42b983;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .word-bank-close:hover {
            background: #f0f9f6;
        }
        @media (max-width: 600px) {
            .sentence-container {
                flex-direction: column;
                gap: 0;
            }
            .connector {
                display: none;
            }
            .word-box {
                margin: 12px 0;
                min-width: 90vw;
            }
            body {
                padding: 10px 2vw;
            }
            .upload-panel {
                min-width: 90vw;
                padding: 18px 6vw 12px 6vw;
            }
            .sentence-output-card {
                padding: 12px 4vw 8px 4vw;
                max-width: 98vw;
            }
            .output-words {
                flex-direction: column;
                gap: 6px;
            }
            .word-bank-panel {
                padding: 20px;
                width: 95%;
            }
            .word-list {
                gap: 8px;
            }
            .word-item {
                font-size: 1rem;
                padding: 6px 12px;
            }
        }
        .history-btn {
            background: #f7b500;
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            margin: 10px 8px 10px 0;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 2px 8px 0 rgba(247,181,0,0.08);
            transition: background 0.2s, transform 0.2s;
            font-weight: 500;
        }
        .history-btn:hover {
            background: #e09e00;
            transform: translateY(-2px) scale(1.04);
        }
        .history-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(60,60,120,0.10);
            display: none;
            align-items: flex-start;
            justify-content: center;
            z-index: 300;
            padding: 40px 20px;
            overflow-y: auto;
            animation: fadeIn 0.25s;
        }
        .history-panel {
            background: #fff;
            border-radius: 14px;
            padding: 32px;
            width: 95%;
            max-width: 1100px;
            box-shadow: 0 8px 32px 0 rgba(66,185,131,0.13);
            animation: panelPop 0.25s;
            position: relative;
        }
        .history-title {
            font-size: 1.5rem;
            color: #35495e;
            margin-bottom: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-day-block {
            margin-bottom: 36px;
            border-bottom: 1.5px solid #e5e9f2;
            padding-bottom: 18px;
        }
        .history-date {
            font-size: 1.18rem;
            color: #42b983;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .history-word-section {
            margin-bottom: 10px;
        }
        .history-word-section-title {
            font-size: 1.08rem;
            color: #5c7080;
            margin-bottom: 6px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .history-word-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .history-word-item {
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 7px;
            background: #f8fafc;
            font-weight: 600;
            box-shadow: 0 1px 4px 0 rgba(66,185,131,0.06);
            transition: background 0.2s, color 0.2s;
        }
        .history-word-count {
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }
        .history-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: #f7b500;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .history-close:hover {
            background: #fffbe6;
        }
        @media (max-width: 600px) {
            .history-panel {
                padding: 14px;
                width: 99vw;
            }
            .history-word-item {
                font-size: 0.98rem;
                padding: 4px 8px;
            }
        }
        #customUploadBtn {
            background: #42b983;
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-size: 1.08rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px 0 rgba(66,185,131,0.10);
            transition: background 0.2s, transform 0.2s;
            font-weight: 500;
        }
        #customUploadBtn:hover {
            background: #36976b;
            transform: translateY(-2px) scale(1.04);
        }
        #fileName {
            margin-left: 8px;
            font-size: 1.05rem;
            color: #42b983;
        }
        .button-group-center {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 0 0;
        }
        /* 设置按钮 */
        .upload-fab#settingsFab {
            top: 90px;
            right: 32px;
            background: #f7b500;
        }
        .upload-fab#settingsFab:hover {
            background: #e09e00;
        }
        .upload-fab#settingsFab .upload-fab-icon {
            color: #fff;
        }
        /* 设置弹窗 */
        .upload-modal#settingsModal {
            display: none;
        }
        .upload-panel#settingsPanel {
            padding: 32px;
            width: 320px;
            max-width: 100%;
        }
        .upload-panel#settingsPanel .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #42b983;
            cursor: pointer;
        }
        .upload-tips#settingsTips {
            margin-bottom: 14px;
        }
        .upload-panel#settingsPanel input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1.5px solid #42b983;
            background: #f8fafc;
            color: #35495e;
            outline: none;
        }
        .upload-panel#settingsPanel button {
            background: #42b983;
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .upload-panel#settingsPanel button:hover {
            background: #36976b;
        }
        .upload-panel#settingsPanel #deepseekKeyStatus {
            color: #36976b;
            font-size: 1.05rem;
            margin-top: 6px;
        }
        /* 语法检测弹窗样式 */
        .grammar-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(60,60,120,0.10);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 400;
            animation: fadeIn 0.25s;
        }
        .grammar-panel {
            background: #fff;
            border-radius: 14px;
            padding: 32px 32px 24px 32px;
            min-width: 320px;
            max-width: 95vw;
            box-shadow: 0 8px 32px 0 rgba(66,185,131,0.13);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: panelPop 0.25s;
            position: relative;
        }
        .grammar-panel .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #42b983;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .grammar-panel {
                min-width: 90vw;
                padding: 18px 6vw 12px 6vw;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="reviewModeBar" style="display:none;padding:12px 0 0 0;text-align:center;"></div>
    <div id="emptyWordBank" style="display:none;padding:80px 0 0 0;text-align:center;">
        <div style="font-size:2.1rem;color:#42b983;font-weight:700;margin-bottom:18px;">单词库为空</div>
        <div style="font-size:1.18rem;color:#888;margin-bottom:30px;">请点击右上角 <span style='font-size:1.6rem;color:#42b983;'>＋</span> 上传单词库</div>
        <button class="vue-btn" style="font-size:1.1rem;" onclick="document.getElementById('uploadFab').click()">上传单词库</button>
    </div>
    <h1>随机组词小程序(横向版)</h1>
    <p>每次刷新都会生成一个新的动词+形容词+名词组合</p >
    
    <div class="sentence-container">
        <div class="word-box">
            <div class="word" id="verb-container">
                <span id="verb"></span>
                <span class="word-badge" id="verb-count"></span>
            </div>
            <div class="word-type">动词</div>
        </div>
        <div class="connector">+</div>
        <div class="word-box">
            <div class="word" id="adjective-container">
                <span id="adjective"></span>
                <span class="word-badge" id="adjective-count"></span>
            </div>
            <div class="word-type">形容词</div>
        </div>
        <div class="connector">+</div>
        <div class="word-box">
            <div class="word" id="noun-container">
                <span id="noun"></span>
                <span class="word-badge" id="noun-count"></span>
            </div>
            <div class="word-type">名词</div>
        </div>
    </div>
    <hr class="divider"/>
    <!-- 上传右上角悬浮按钮 -->
    <button class="upload-fab" id="uploadFab" title="上传自定义词库">
        <span class="upload-fab-icon">&#43;</span>
    </button>
    <!-- 设置按钮 -->
    <button class="upload-fab" id="settingsFab" title="设置" style="top:90px;right:32px;background:#f7b500;"><span class="upload-fab-icon">⚙️</span></button>
    <!-- 上传弹窗 -->
    <div class="upload-modal" id="uploadModal" style="display:none;">
        <div class="upload-panel">
            <button class="close-btn" id="closeUploadModal" title="关闭">&times;</button>

        function getWordCounts(key) {
            return JSON.parse(localStorage.getItem(key)) || {};

        function setWordCounts(key, obj) {
            localStorage.setItem(key, JSON.stringify(obj));

        function updateWordBadges(verb, adjective, noun) {
            let verbCounts = getWordCounts('verbCounts');
            let adjectiveCounts = getWordCounts('adjectiveCounts');
            let nounCounts = getWordCounts('nounCounts');
            // 动词
            if (verbCounts[verb] > 0) {

            // 形容词

        }
        // 复习模式全局变量
        function setReviewMode(day, words) {
            sessionStorage.setItem('reviewMode', JSON.stringify({ day, words }));

        function getReviewMode() {
            return JSON.parse(sessionStorage.getItem('reviewMode') || 'null');

        function clearReviewMode() {

        // 顶部复习模式提示栏
        function updateReviewModeBar() {
            const bar = document.getElementById('reviewModeBar');
            const review = getReviewMode();
            if (review) {
                bar.style.display = '';
                bar.innerHTML = `
                    <div style='background:#eafaf5;border-radius:8px;padding:10px 0 8px 0;color:#42b983;font-size:1.13rem;font-weight:600;'>
                        复习模式：${review.day} &nbsp;
                        <button class='vue-btn' style='background:#f7b500;margin-left:12px;' onclick='exitReviewMode()'>退出复习</button>
                    </div>

                bar.style.display = 'none';
                bar.innerHTML = '';
            }
        }
        function exitReviewMode() {
            clearReviewMode();
            updateReviewModeBar();
            generateSentence();
        }
        // 获取当前词库（优先复习模式）
        function getCurrentWords() {
            const review = getReviewMode();
            if (review) {
                return review.words;
            } else {
                return {
                    verbs: JSON.parse(localStorage.getItem('verbs')) || words.verbs,
                    adjectives: JSON.parse(localStorage.getItem('adjectives')) || words.adjectives,
                    nouns: JSON.parse(localStorage.getItem('nouns')) || words.nouns
                };
            }
        }
        // 修改 showSentence/造句等函数，统一用 getCurrentWords()
        function showSentence() {
            const w = getCurrentWords();
            const verbs = w.verbs;
            const adjectives = w.adjectives;
            const nouns = w.nouns;
            const verb = verbs[Math.floor(Math.random() * verbs.length)];
            const adjective = adjectives[Math.floor(Math.random() * adjectives.length)];
            const noun = nouns[Math.floor(Math.random() * nouns.length)];
            document.getElementById("verb").textContent = verb;
            document.getElementById("adjective").textContent = adjective;
            document.getElementById("noun").textContent = noun;
            document.getElementById("deepseek-sentence").textContent = '';
            updateWordBadges(verb, adjective, noun);
            clearGrammarModal(); // 新增：刷新组合时清空语法检测弹窗内容
        }
        function generateSentence() {
            showSentence();
        }
        function generateDeepSeekSentence() {
            // 计数+历史记录逻辑
            var w = getCurrentWords();
            var verbs = w.verbs;
            var adjectives = w.adjectives;
            var nouns = w.nouns;
            var verb = document.getElementById("verb").textContent;
            var adjective = document.getElementById("adjective").textContent;
            var noun = document.getElementById("noun").textContent;
            // 计数逻辑
            var verbCounts = getWordCounts('verbCounts');
            var adjectiveCounts = getWordCounts('adjectiveCounts');
            var nounCounts = getWordCounts('nounCounts');
            verbCounts[verb] = (verbCounts[verb] || 0) + 1;
            adjectiveCounts[adjective] = (adjectiveCounts[adjective] || 0) + 1;
            nounCounts[noun] = (nounCounts[noun] || 0) + 1;
            setWordCounts('verbCounts', verbCounts);
            setWordCounts('adjectiveCounts', adjectiveCounts);
            setWordCounts('nounCounts', nounCounts);
            // 历史记录逻辑
            var today = getTodayStr();
            var history = getHistoryWordBank();
            if (!history[today]) {
                history[today] = { verbs: {}, adjectives: {}, nouns: {} };
            }
            history[today].verbs[verb] = (history[today].verbs[verb] || 0) + 1;
            history[today].adjectives[adjective] = (history[today].adjectives[adjective] || 0) + 1;
            history[today].nouns[noun] = (history[today].nouns[noun] || 0) + 1;
            setHistoryWordBank(history);
            var prompt = '\n请根据 susan 教英语的随机造句的理念，用这三个词造一个有趣的简单的英文句子：' + verb + ', ' + adjective + ', ' + noun + '。\n输出的格式示例为：\n句子：This is a good apple.<br/>\n翻译：这是一个好苹果。<br/>\nSusan式趣味解析：<br/>\n1. This 是这个，表示某个特定的苹果。<br/>\n2. is 是是，表示这个苹果是好的。<br/>\n3. a 是一个，表示这个苹果是一个。<br/>\n4. good 是好的，表示这个苹果是好的。<br/>\n5. apple 是苹果，表示这个苹果是一个苹果。<br/>\n拓展：\n1. 这个苹果是好的，表示这个苹果是好的。<br/>\n2. 这个苹果是一个苹果，表示这个苹果是一个苹果。<br/>\n';
            document.getElementById("deepseek-sentence").innerHTML = '<div class="sentence-output-card"><div class="output-title"><span class="icon">✏️</span>造句结果</div><div style="color:#888;">正在生成...</div></div>';
            // 获取 deepseek key
            var userKey = getDeepseekKey();
            var apiKey = userKey || 'sk-aff2dc71dfa549fe9cb064ffd8754434'; // 用户优先，否则用默认

            // 兼容性处理 fetch
            function doRequest() {
                var url = 'https://api.deepseek.com/v1/chat/completions';
                var headers = {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + apiKey
                };
                var body = JSON.stringify({
                    model: 'deepseek-chat',
                    messages: [
                        {"role": "user", "content": prompt}
                    ]
                });
                // 优先用 fetch
                if (window.fetch) {
                    return window.fetch(url, {
                        method: 'POST',
                        headers: headers,
                        body: body
                    }).then(function(response) {
                        if (!response.ok) throw new Error('网络错误');
                        return response.text();
                    }).then(function(text) {
                        try {
                            return JSON.parse(text);
                        } catch (e) {
                            throw new Error('返回内容解析失败');
                        }
                    });
                } else {
                    // 用 XMLHttpRequest
                    return new Promise(function(resolve, reject) {
                        var xhr = new XMLHttpRequest();
                        xhr.open('POST', url, true);
                        xhr.setRequestHeader('Content-Type', 'application/json');
                        xhr.setRequestHeader('Authorization', 'Bearer ' + apiKey);
                        xhr.onreadystatechange = function() {
                            if (xhr.readyState === 4) {
                                if (xhr.status >= 200 && xhr.status < 300) {
                                    try {
                                        resolve(JSON.parse(xhr.responseText));
                                    } catch (e) {
                                        reject(new Error('返回内容解析失败'));
                                    }
                                } else {
                                    reject(new Error('网络错误'));
                                }
                            }
                        };
                        xhr.onerror = function() {
                            reject(new Error('网络请求失败'));
                        };
                        xhr.send(body);
                    });
                }
            }

            doRequest().then(function(data) {
                // 兼容 ?. 写法
                var sentence = '';
                if (data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
                    sentence = data.choices[0].message.content;
                } else {
                    sentence = '生成失败';
                }
                // 拆分句子、翻译、解析
                var en = '', zh = '', analysis = '';
                var enMatch = sentence.match(/句子：(.+?)<br\/?/);
                var zhMatch = sentence.match(/翻译：(.+?)<br\/?/);
                var analysisMatch = sentence.match(/Susan式趣味解析：<br\/?([\s\S]*)/);
                if (enMatch) en = enMatch[1].trim();
                if (zhMatch) zh = zhMatch[1].trim();
                if (analysisMatch) analysis = analysisMatch[1].replace(/<br\/?/g, '<br/>').trim();
                // 高亮随机词
                function highlightWords(str) {
                    if (!str) return '';
                    var result = str;
                    [verb, adjective, noun].forEach(function(word) {
                        if (word) {
                            var reg = new RegExp('(?<![a-zA-Z])' + word + '(?![a-zA-Z])', 'gi');
                            // 部分浏览器不支持负向断言，降级处理
                            try {
                                result = result.replace(reg, function(match) {
                                    return "<span class='highlight-word'>" + match + "</span>";
                                });
                            } catch (e) {
                                // 不支持 lookbehind/forward，直接全局替换
                                result = result.replace(new RegExp(word, 'gi'), function(match) {
                                    return "<span class='highlight-word'>" + match + "</span>";
                                });
                            }
                        }
                    });
                    return result;
                }
                // 输出结构
                document.getElementById("deepseek-sentence").innerHTML =
                    "<div class='sentence-output-card'>" +
                    "<div class='output-title'><span class='icon'>✏️</span>造句结果</div>" +
                    "<div class='output-words'>" +
                    "<span class='output-word-tag verb'>动词：" + verb + "</span>" +
                    "<span class='output-word-tag adj'>形容词：" + adjective + "</span>" +
                    "<span class='output-word-tag noun'>名词：" + noun + "</span>" +
                    "</div>" +
                    "<div class='output-section'>" +
                    "<div class='output-label'>英文句子</div>" +
                    "<div class='output-sentence-row'>" +
                    "<div class='output-sentence' id='output-en-sentence'>" + highlightWords(en) + "</div>" +
                    "<button class='speak-btn' id='speakEnBtn' title='朗读英文句子'>🔊</button>" +
                    "</div>" +
                    "</div>" +
                    "<div class='output-section'>" +
                    "<div class='output-label'>中文翻译</div>" +
                    "<div class='output-translation'>" + zh + "</div>" +
                    "</div>" +
                    "<div class='output-section'>" +
                    "<div class='output-label'>Susan式趣味解析</div>" +
                    "<div class='output-analysis'>" + highlightWords(analysis) + "</div>" +
                    "</div>" +
                    "</div>";
                // 绑定朗读按钮事件
                setTimeout(function() {
                    var speakBtn = document.getElementById('speakEnBtn');
                    if (speakBtn) {
                        speakBtn.onclick = function() {
                            var enText = document.getElementById('output-en-sentence') && document.getElementById('output-en-sentence').innerText || '';
                            if (enText && window.speechSynthesis) {
                                var utter = new window.SpeechSynthesisUtterance(enText);
                                utter.lang = 'en-US';
                                window.speechSynthesis.speak(utter);
                            }
                        };
                    }
                }, 100);
            }).catch(function(e) {
                var msg = e && e.message ? e.message : e;
                document.getElementById("deepseek-sentence").innerHTML = "<div class='sentence-output-card'><div class='output-title'><span class='icon'>✏️</span>造句结果</div><div style='color:#c00;'>生成失败: " + msg + "</div></div>";
            });
        }

        // 处理上传
        document.getElementById('customUploadBtn').onclick = function() {
            document.getElementById('upload').click();
        };
        document.getElementById('upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            document.getElementById('fileName').textContent = file ? file.name : '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                // 去掉第一行标题
                const rows = json.slice(1);
                // 分别提取三列并去重
                const verbs = Array.from(new Set(rows.map(row => row[0]).filter(Boolean)));
                const adjectives = Array.from(new Set(rows.map(row => row[1]).filter(Boolean)));
                const nouns = Array.from(new Set(rows.map(row => row[2]).filter(Boolean)));
                // 保存到localStorage
                localStorage.setItem('verbs', JSON.stringify(verbs));
                localStorage.setItem('adjectives', JSON.stringify(adjectives));
                localStorage.setItem('nouns', JSON.stringify(nouns));
                document.getElementById('uploadStatus').innerText = 
                    `已保存：动词${verbs.length}个，形容词${adjectives.length}个，名词${nouns.length}个到自定义词库！`;
                // 上传后自动刷新页面
                setTimeout(() => { location.reload(); }, 600);
            };
            reader.readAsArrayBuffer(file);
        });

        // 上传弹窗逻辑
        const uploadFab = document.getElementById('uploadFab');
        const uploadModal = document.getElementById('uploadModal');
        const closeUploadModal = document.getElementById('closeUploadModal');
        uploadFab.onclick = function() {
            uploadModal.style.display = 'flex';
        };
        closeUploadModal.onclick = function() {
            uploadModal.style.display = 'none';
            document.getElementById('upload').value = '';
            document.getElementById('uploadStatus').innerText = '';
        };
        // 点击遮罩关闭弹窗
        uploadModal.addEventListener('click', function(e) {
            if (e.target === uploadModal) {
                uploadModal.style.display = 'none';
                document.getElementById('upload').value = '';
                document.getElementById('uploadStatus').innerText = '';
            }
        });

        // 清空自定义词库
        function clearWordBank() {
            localStorage.removeItem('verbs');
            localStorage.removeItem('adjectives');
            localStorage.removeItem('nouns');
            document.getElementById('uploadStatus').innerText = '自定义词库已清空，恢复默认词库！';
            generateSentence();
        }
        // 新增：清空单词计数
        function clearWordCounts() {
            localStorage.removeItem('verbCounts');
            localStorage.removeItem('adjectiveCounts');
            localStorage.removeItem('nounCounts');
        }

        // 页面加载时只展示，不计数
        window.onload = function() {
            // 检查单词库是否为空
            const verbs = JSON.parse(localStorage.getItem('verbs')) || words.verbs;
            const adjectives = JSON.parse(localStorage.getItem('adjectives')) || words.adjectives;
            const nouns = JSON.parse(localStorage.getItem('nouns')) || words.nouns;
            const isEmpty = (!verbs || verbs.length === 0) && (!adjectives || adjectives.length === 0) && (!nouns || nouns.length === 0);
            if (isEmpty) {
                // 隐藏主内容，显示空白页
                document.getElementById('emptyWordBank').style.display = '';
                // 隐藏主内容区、所有操作按钮、标题和副标题
                document.querySelectorAll('.sentence-container, .divider, .button-group-center, #deepseek-sentence, h1, p').forEach(el => el.style.display = 'none');
            } else {
                document.getElementById('emptyWordBank').style.display = 'none';
                document.querySelectorAll('.sentence-container, .divider, .button-group-center, #deepseek-sentence, h1, p').forEach(el => el.style.display = '');
                updateReviewModeBar();
                showSentence();
            }
        };

        // 获取颜色渐变
        function getColorByCount(count) {
            if (count === 0) return '#42b983'; // 未使用为绿色
            // 将使用次数限制在0-20范围内计算渐变
            const ratio = Math.min(count, 20) / 20;
            // 计算RGB值：从绿色(66,185,131)渐变到深红色(204,51,51)
            const r = Math.round(66 + (204 - 66) * ratio);
            const g = Math.round(185 + (51 - 185) * ratio);
            const b = Math.round(131 + (51 - 131) * ratio);
            return `rgb(${r},${g},${b})`;
        }

        // 展示单词库
        function showWordBank() {
            const modal = document.getElementById('wordBankModal');
            modal.style.display = 'flex';

            // 获取词库和使用次数，并去重
            const w = getCurrentWords();
            const verbs = Array.from(new Set(w.verbs));
            const adjectives = Array.from(new Set(w.adjectives));
            const nouns = Array.from(new Set(w.nouns));
            const verbCounts = getWordCounts('verbCounts');
            const adjectiveCounts = getWordCounts('adjectiveCounts');
            const nounCounts = getWordCounts('nounCounts');

            // 处理并排序单词列表
            function processWordList(words, counts) {
                return words.map(word => ({
                    word,
                    count: counts[word] || 0
                })).sort((a, b) => b.count - a.count);
            }

            const verbList = processWordList(verbs, verbCounts);
            const adjList = processWordList(adjectives, adjectiveCounts);
            const nounList = processWordList(nouns, nounCounts);

            // 渲染单词列表
            function renderWordList(list, containerId) {
                const container = document.getElementById(containerId);
                container.innerHTML = list.map(item => {
                    const color = getColorByCount(item.count);
                    const countText = item.count > 20 ? `${item.count} (20+)` : item.count;
                    return `
                        <div class="word-item" style="background: ${color}; color: #fff;">
                            ${item.word}
                            <span class="word-item-count">${countText}</span>
                        </div>
                    `;
                }).join('');
            }

            renderWordList(verbList, 'verbList');
            renderWordList(adjList, 'adjList');
            renderWordList(nounList, 'nounList');
        }

        // 关闭单词库
        function closeWordBank() {
            document.getElementById('wordBankModal').style.display = 'none';
        }

        // 点击遮罩关闭单词库
        document.getElementById('wordBankModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeWordBank();
            }
        });

        // 历史单词库记录与展示
        function getTodayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function getHistoryWordBank() {
            return JSON.parse(localStorage.getItem('historyWordBank') || '{}');
        }
        function setHistoryWordBank(obj) {
            console.log(obj);
            localStorage.setItem('historyWordBank', JSON.stringify(obj));
        }
        // 历史单词库颜色
        function getHistoryColorByCount(count) {
            if (count === 0) return '#42b983';
            const ratio = Math.min(count, 20) / 20;
            const r = Math.round(66 + (204 - 66) * ratio);
            const g = Math.round(185 + (51 - 185) * ratio);
            const b = Math.round(131 + (51 - 131) * ratio);
            return `rgb(${r},${g},${b})`;
        }
        // 计算记忆曲线推荐复习日期
        function getReviewCurveDates() {
            const today = new Date();
            const intervals = [1, 2, 4, 7, 15, 30];
            return intervals.map(days => {
                const d = new Date(today);
                d.setDate(d.getDate() - days);
                return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
            });
        }
        // 展示历史单词库
        function showHistoryModal() {
            const modal = document.getElementById('historyModal');
            modal.style.display = 'flex';
            const history = getHistoryWordBank();
            const days = Object.keys(history).sort((a,b)=>b.localeCompare(a));
            let html = '';
            // 推荐复习区块
            const reviewDates = getReviewCurveDates();
            const availableReviews = reviewDates.filter(day => history[day]);
            if (availableReviews.length > 0) {
                html += `<div style='background:#eafaf5;border-radius:8px;padding:14px 12px 10px 12px;margin-bottom:18px;'>`;
                html += `<span style='color:#42b983;font-size:1.12rem;font-weight:600;'>记忆曲线推荐复习：</span> `;
                availableReviews.forEach(day => {
                    html += `<button class='vue-btn' style='background:#42b983;margin:0 8px 0 0;font-size:0.98rem;padding:6px 18px;' onclick='enterReviewMode("${day}")'>${day} 复习</button>`;
                });
                html += `</div>`;
            }
            if (days.length === 0) {
                html += '<div style="color:#888;font-size:1.1rem;">暂无历史记录</div>';
            } else {
                days.forEach(day => {
                    html += `<div class='history-day-block'>`;
                    html += `<div class='history-date'>📅 ${day} <button class='vue-btn' style='background:#42b983;margin-left:16px;font-size:0.98rem;padding:6px 18px;' onclick='enterReviewMode("${day}")'>复习</button></div>`;
                    // 动词
                    const verbs = Object.entries(history[day].verbs || {}).sort((a,b)=>b[1]-a[1]);
                    html += `<div class='history-word-section'><div class='history-word-section-title'>🎯 动词</div><div class='history-word-list'>`;
                    if (verbs.length === 0) {
                        html += '<span style="color:#bbb;">无</span>';
                    } else {
                        verbs.forEach(([word, count]) => {
                            html += `<span class='history-word-item' style='background:${getHistoryColorByCount(count)};color:#fff;'>${word}<span class='history-word-count'>${count}</span></span>`;
                        });
                    }
                    html += `</div></div>`;
                    // 形容词
                    const adjs = Object.entries(history[day].adjectives || {}).sort((a,b)=>b[1]-a[1]);
                    html += `<div class='history-word-section'><div class='history-word-section-title'>✨ 形容词</div><div class='history-word-list'>`;
                    if (adjs.length === 0) {
                        html += '<span style="color:#bbb;">无</span>';
                    } else {
                        adjs.forEach(([word, count]) => {
                            html += `<span class='history-word-item' style='background:${getHistoryColorByCount(count)};color:#fff;'>${word}<span class='history-word-count'>${count}</span></span>`;
                        });
                    }
                    html += `</div></div>`;
                    // 名词
                    const nouns = Object.entries(history[day].nouns || {}).sort((a,b)=>b[1]-a[1]);
                    html += `<div class='history-word-section'><div class='history-word-section-title'>🎨 名词</div><div class='history-word-list'>`;
                    if (nouns.length === 0) {
                        html += '<span style="color:#bbb;">无</span>';
                    } else {
                        nouns.forEach(([word, count]) => {
                            html += `<span class='history-word-item' style='background:${getHistoryColorByCount(count)};color:#fff;'>${word}<span class='history-word-count'>${count}</span></span>`;
                        });
                    }
                    html += `</div></div>`;
                    html += `</div>`;
                });
            }
            document.getElementById('historyContent').innerHTML = html;
        }
        function closeHistoryModal() {
            document.getElementById('historyModal').style.display = 'none';
        }
        document.getElementById('historyModal').addEventListener('click', function(e) {
            if (e.target === this) closeHistoryModal();
        });
        // 进入复习模式
        function enterReviewMode(day) {
            const history = getHistoryWordBank();
            if (!history[day]) return;
            // 只取有用的单词，去重
            const verbs = Object.keys(history[day].verbs || {});
            const adjectives = Object.keys(history[day].adjectives || {});
            const nouns = Object.keys(history[day].nouns || {});
            setReviewMode(day, { verbs, adjectives, nouns });
            updateReviewModeBar();
            generateSentence();
            // 关闭历史弹窗
            document.getElementById('historyModal').style.display = 'none';
        }
        // DeepSeek Key 设置相关
        function getDeepseekKey() {
            return localStorage.getItem('deepseekKey') || '';
        }
        function setDeepseekKey(key) {
            localStorage.setItem('deepseekKey', key);
        }
        // 设置按钮弹窗逻辑
        const settingsFab = document.getElementById('settingsFab');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsModal = document.getElementById('closeSettingsModal');
        const deepseekKeyInput = document.getElementById('deepseekKeyInput');
        const saveDeepseekKeyBtn = document.getElementById('saveDeepseekKeyBtn');
        const deepseekKeyStatus = document.getElementById('deepseekKeyStatus');
        settingsFab.onclick = function() {
            settingsModal.style.display = 'flex';
            deepseekKeyInput.value = getDeepseekKey();
            deepseekKeyStatus.innerText = '';
        };
        closeSettingsModal.onclick = function() {
            settingsModal.style.display = 'none';
            deepseekKeyStatus.innerText = '';
        };
        settingsModal.addEventListener('click', function(e) {
            if (e.target === settingsModal) {
                settingsModal.style.display = 'none';
                deepseekKeyStatus.innerText = '';
            }
        });
        saveDeepseekKeyBtn.onclick = function() {
            const key = deepseekKeyInput.value.trim();
            if (!key) {
                deepseekKeyStatus.innerText = 'Key 不能为空！';
                deepseekKeyStatus.style.color = '#c00';
                return;
            }
            setDeepseekKey(key);
            deepseekKeyStatus.innerText = '已保存！';
            deepseekKeyStatus.style.color = '#36976b';
        };
        // 语法检测弹窗逻辑
        const grammarModal = document.getElementById('grammarModal');
        const openGrammarBtn = document.getElementById('toggleGrammarCheckBtn');
        const closeGrammarBtn = document.getElementById('closeGrammarModal');
        openGrammarBtn.onclick = function() {
            grammarModal.style.display = 'flex';
        };
        closeGrammarBtn.onclick = function() {
            grammarModal.style.display = 'none';
            document.getElementById('userSentence').value = '';
            document.getElementById('grammarResult').innerHTML = '';
        };
        grammarModal.addEventListener('click', function(e) {
            if (e.target === grammarModal) {
                grammarModal.style.display = 'none';
                document.getElementById('userSentence').value = '';
                document.getElementById('grammarResult').innerHTML = '';
            }
        });
        // 语法检查功能
        function grammarCheck() {
            var sentence = document.getElementById('userSentence').value.trim();
            var resultDiv = document.getElementById('grammarResult');
            if (!sentence) {
                resultDiv.innerHTML = "<span style='color:#c00;'>请输入英文句子！</span>";
                return;
            }
            resultDiv.innerHTML = "正在检查语法...";
            fetch('https://api.languagetoolplus.com/v2/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `text=${encodeURIComponent(sentence)}&language=en-US`
            })
            .then(res => res.json())
            .then(data => {
                if (data.matches && data.matches.length > 0) {
                    let html = "<span style='color:#c00;font-weight:600;'>发现语法/拼写问题：</span><ul>";
                    data.matches.forEach(match => {
                        html += `<li>${match.message}<br/>
                            <span style='color:#888;'>建议：${match.replacements.map(r=>r.value).join(', ') || '无'}</span>
                            <br/><span style='color:#aaa;'>位置：${sentence.substring(match.offset, match.offset+match.length)}</span>
                        </li>`;
                    });
                    html += "</ul>";
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = "<span style='color:#42b983;font-weight:600;'>没有发现语法问题，句子看起来没问题！</span>";
                }
            })
            .catch(e => {
                resultDiv.innerHTML = "<span style='color:#c00;'>检查失败：" + e + "</span>";
            });
        }
        if(document.getElementById('checkGrammarBtn')){
            document.getElementById('checkGrammarBtn').onclick = grammarCheck;
        }
        // 刷新组合时清空语法检测弹窗内容
        function clearGrammarModal() {
            if(document.getElementById('userSentence')){
                document.getElementById('userSentence').value = '';
            }
            if(document.getElementById('grammarResult')){
                document.getElementById('grammarResult').innerHTML = '';
            }
        }
    </script>
</body>
</html>
